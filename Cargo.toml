[package]
name = "rift"
version = "0.3.0"
edition = "2024"
description = "Lightweight multi-format clipboard manager for Wayland"
license = "MIT"

[dependencies]
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
imagesize = "0.15.0"
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "fs", "io-util", "time", "signal", "sync"] }
tokio-pipe = "0.2.12"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wayrs-client = { version = "1.3.1", features = ["tokio"] }
wayrs-protocols = { version = "0.14.11", features = ["wlr-data-control-unstable-v1"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
